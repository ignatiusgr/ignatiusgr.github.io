<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        body {
            font-family: helvetica, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
            color: #545a5e
        }
        h1 {
            color: #b3cee2;
        }
        .chart-container {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Bienvenido o bienvenida</h1>
    <p>Esto es un experimento, por favor, ignore.</p>
    <p>This is just an experiment, please ignore.</p>
        
    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>

    <!-- Chart.js library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Your chart code -->
    <script>
        const ctx = document.getElementById('myChart');
        
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'],
                datasets: [{
                    label: 'My level of energy as I move through the year',
                    data: [35, 50, 40, 65, 70, 65, 55, 60, 89, 85, 75, 70],
                    backgroundColor: [
                        'rgba(78, 128, 152, 1)',
                    ],
                    borderColor: [
                        'rgba(0, 0, 0, 0)',
                    ],
                    borderRadius: {
                        topLeft: 10,
                        topRight: 10
                    },
                    borderSkipped: false
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        enabled: true
                    },
                    datalabels: {
                        anchor: 'end',
                        align: 'top',
                        font: {
                            weight: 'bold',
                            size: 14
                        },
                        color: '#333'
                    }
                },
                scales: {
                    y: {
                        display: false,  // Hides Y axis
                        beginAtZero: true,
                        grid: {
                            display: false  // Removes grid lines
                        }
                    }
                },
            plugins: [{
                afterDatasetsDraw: function(chart) {
                    const ctx = chart.ctx;
                    chart.data.datasets.forEach((dataset, i) => {
                        const meta = chart.getDatasetMeta(i);
                        meta.data.forEach((bar, index) => {
                            const data = dataset.data[index];
                            ctx.fillStyle = '#333';
                            ctx.font = 'bold 14px Arial';
                            ctx.textAlign = 'center';
                            ctx.fillText(data, bar.x, bar.y - 5);
                        });
                    });
                }
            }],
        }
            });
    </script>
</body>
</html>
